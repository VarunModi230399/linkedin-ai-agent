services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin_agent_postgres
    environment:
      POSTGRES_DB: linkedin_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - agent-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: linkedin_agent_redis
    ports:
      - "6379:6379"
    networks:
      - agent-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: linkedin_agent_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent-net
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: linkedin_agent_langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:changeme@postgres:5432/langfuse
      NEXTAUTH_SECRET: changeme_langfuse_secret_min_32_chars_long
      NEXTAUTH_URL: http://localhost:3000
      SALT: changeme_langfuse_salt_min_32_chars_long_xx
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      - postgres
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  langfuse_data:

networks:
  agent-net:
    driver: bridge