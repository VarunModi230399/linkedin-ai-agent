services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin_agent_postgres
    environment:
      POSTGRES_DB: linkedin_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - agent-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: linkedin_agent_redis
    ports:
      - "6379:6379"
    networks:
      - agent-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: linkedin_agent_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:

networks:
  agent-net:
    driver: bridge