services:

  # ── Infrastructure ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: linkedin_agent_postgres
    environment:
      POSTGRES_DB: linkedin_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - agent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d linkedin_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkedin_agent_redis
    ports:
      - "6379:6379"
    networks:
      - agent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: linkedin_agent_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent-net
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: linkedin_agent_langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:changeme@postgres:5432/langfuse
      NEXTAUTH_SECRET: changeme_langfuse_secret_min_32_chars_long
      NEXTAUTH_URL: http://localhost:3000
      SALT: changeme_langfuse_salt_min_32_chars_long_xx
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  # ── Application ───────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: linkedin_agent_api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:changeme@postgres:5432/linkedin_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped
    volumes:
      - ../src:/app/src  # hot reload for development

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: linkedin_agent_worker
    command: celery -A src.worker.celery_app worker --loglevel=info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:changeme@postgres:5432/linkedin_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: linkedin_agent_beat
    command: celery -A src.worker.beat_schedule beat --loglevel=info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:changeme@postgres:5432/linkedin_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  langfuse_data:

networks:
  agent-net:
    driver: bridge