[project]
name = "linkedin-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery[redis]>=5.4",
    "qdrant-client>=1.10",
    "tavily-python>=0.3",
    "httpx>=0.27",
    "authlib>=1.3",
    "structlog>=24.0",
    "greenlet>=3.5.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "langfuse>=2.0,<3.0",
    "langchain-openai>=1.2.2",
    "langchain>=1.3.1",
    "langchain-community>=0.4.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "langgraph-cli[inmem]>=0.4.26",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501", "F401", "I001"] # Added I001 here to stop sorting errors

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "types-redis>=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
